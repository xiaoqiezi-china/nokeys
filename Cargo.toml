[package]
name = "nokeys"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.56.0"
rfd = "0.18.0"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
