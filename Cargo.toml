[package]
name = "nokeys"
version = "1.0.1"
edition = "2021"
description = "Windows 全局轮盘 / 列表快捷启动器"
authors = ["xiaoqie"]

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }
rfd = "0.18.0"

[[bin]]
name = "nokeys"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
